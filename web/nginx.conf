server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://app:8000;
    }

    location = /docs {
        proxy_pass http://app:8000;
    }

    location = /openapi.json {
        proxy_pass http://app:8000;
    }

    location = /health {
        proxy_pass http://app:8000;
    }
}
