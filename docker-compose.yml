services:
  db:
    image: postgres:18.4
    container_name: abs_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abs_password}
      POSTGRES_DB: ${POSTGRES_DB:-abs_inventory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abs_app
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://abs_user:abs_password@db:5432/abs_inventory}
      PORT: ${PORT:-8000}
    volumes:
      - .:/app
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: abs_test
    environment:
      APP_ENV: test
      DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://abs_user:abs_password@db:5432/abs_inventory_test}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest", "-q"]

volumes:
  pg_data:
