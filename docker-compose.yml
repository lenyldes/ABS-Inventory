services:
  db:
    image: postgres:18.4
    container_name: ${ABS_DB_CONTAINER:-abs_db}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abs_password}
      POSTGRES_DB: ${POSTGRES_DB:-abs_inventory}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${ABS_APP_CONTAINER:-abs_app}
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://abs_user:abs_password@db:5432/abs_inventory}
      PORT: ${PORT:-8000}
    volumes:
      - .:/app
    ports:
      - "${PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 10
    command: >-
      sh -c 'alembic upgrade head && python -m app.seeds &&
      python -m app.demo_data.bootstrap &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000'

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      app:
        condition: service_healthy

  test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ${ABS_TEST_CONTAINER:-abs_test}
    environment:
      APP_ENV: test
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://abs_user:abs_password@db:5432/abs_inventory_test}
      DATABASE_URL: ${TEST_DATABASE_URL:-postgresql+psycopg://abs_user:abs_password@db:5432/abs_inventory_test}
      MAIN_DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://abs_user:abs_password@db:5432/abs_inventory}
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: ["pytest", "-q"]

volumes:
  pg_data:
